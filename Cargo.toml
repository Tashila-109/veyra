[workspace]
members = ["crates/engine", "crates/veyra"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
gpui-kit = "=0.7.1"
gpui = { package = "gpui-pre", version = "=0.3.8" }
tokio = { version = "=1.53.2", features = ["sync"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
anyhow = "=1.0.104"
libc = "=0.2.190"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
