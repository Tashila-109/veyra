[package]
name = "veyra-engine"
version.workspace = true
edition.workspace = true

[dependencies]
libc.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros", "process", "io-util"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
uuid = { version = "=1.27.0", features = ["v5", "v7", "serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "=2.0.21"
tracing.workspace = true
regex = "=1.13.1"
base64 = "=0.22.1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
