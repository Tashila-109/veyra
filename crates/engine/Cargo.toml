[package]
name = "veyra-engine"
version.workspace = true
edition.workspace = true

[dependencies]
libc.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros", "process", "io-util", "net"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
uuid = { version = "=1.27.0", features = ["v5", "v7", "serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "=2.0.21"
tracing.workspace = true
regex = "=1.13.1"
base64 = "=0.22.1"
sha2 = "=0.10.9"
portable-pty = "=0.8.1"
alacritty_terminal = "=0.26.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSWorkspace", "NSAccessibility"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
