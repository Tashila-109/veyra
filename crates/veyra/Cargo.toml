[package]
name = "veyra"
default-run = "veyra"
version.workspace = true
edition.workspace = true

[dependencies]
veyra-engine = { path = "../engine", version = "=0.0.1" }
gpui-kit.workspace = true
gpui.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[[bin]]
name = "veyra-test-cli"
path = "../engine/src/bin/veyra-fake-cli.rs"
test = false
bench = false
